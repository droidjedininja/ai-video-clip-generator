version: "3.8"

services:
  backend:
    build: ./backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/clips:/app/clips

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
