services:
  backend:
    build: ./backend
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_TIMEOUT_SECONDS: ${WHISPER_TIMEOUT_SECONDS:-600}
      WHISPER_OFFLINE: ${WHISPER_OFFLINE:-0}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-5}
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-24}
      JOB_CLEANUP_INTERVAL_SECONDS: ${JOB_CLEANUP_INTERVAL_SECONDS:-300}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/jobs:/app/jobs
      - whisper-models:/models

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  whisper-models:
